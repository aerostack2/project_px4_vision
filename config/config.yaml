/**:
  # Global Parameters
  ros__parameters:
    tf_timeout_threshold: 0.05

/**:
  # Basic Robotics Functions
  # Platform
  platform:
    ros__parameters:
      max_thrust: 29.0
      min_thrust: 0.15
      # # Indoor RealSense
      # external_odom: true

  # State Estimator
  state_estimator:
    ros__parameters:
      # Indoor Raw Odometry
      plugin_name: "raw_odometry"

      # # Indoor RealSense
      # plugin_name: "raw_odometry"
      # raw_odometry:
      #   odom_sub_topic: "sensor_measurements/realsense/odom"

      # # Indoor Motion Capture
      # plugin_name: "ground_truth"
      # ground_truth:
      #   mocap_sub_topic: "/mocap/rigid_bodies"  # Non-empty: subscribe to mocap instead of a pose topic.
      #   twist_sub_topic: ""  # Empty: differentiate the mocap pose for twist.
      #   twist_smooth_filter_cte: 0.1  # (0,1]; 1 = no filter. Applies to the differentiated twist.
      #   rigid_body_name: "1"

      # # Outdoor (GPS) Raw Odometry
      # plugin_name: "raw_odometry"
      # raw_odometry:
      #   use_gps: true  # Anchor earth at a GPS datum.
      #   gps_origin:
      #     set_origin: "first_gps"  # first_gps: the first fix received becomes the datum.
      #                              # manual: use the coordinates below, so earth lands in
      #                              #   the same place on every flight.
      #                              # service: hold the first fix and wait for a set_origin
      #                              #   call; earth->map is not published until then.
      #     coordinates:  # Only used with "manual".
      #       latitude: 0.0
      #       longitude: 0.0
      #       altitude: 0.0

      # # RealSense odometry fused with the IMU (simple_ekf)
      # # Might need sensor_measurements/imu and covariance tuning.
      # plugin_name: "simple_ekf"
      # simple_ekf:
      #   update_topics: ["odom"]
      #   odom:
      #     topic: "sensor_measurements/realsense/odom"
      #     type: "nav_msgs/msg/Odometry"
      #     set_earth_map: false  # Dead-reckoned: must not define the world origin.
      #     use_message_covariance: true
      #     position_multiplier: [1.0, 1.0, 1.0]
      #     orientation_multiplier: [1.0, 1.0, 1.0]

  # Behaviors Motion
  TakeoffBehavior:
    ros__parameters:
      # takeoff_plugin_name: "takeoff_plugin_speed"
      takeoff_plugin_name: "takeoff_plugin_position"
      # takeoff_plugin_name: "takeoff_plugin_trajectory"
  LandBehavior:
    ros__parameters:
      land_plugin_name: "land_plugin_speed"
      # land_plugin_name: "land_plugin_trajectory"
  GoToBehavior:
    ros__parameters:
      go_to_plugin_name: "go_to_plugin_position"
      # go_to_plugin_name: "go_to_plugin_trajectory"
  FollowPathBehavior:
    ros__parameters:
      follow_path_plugin_name: "follow_path_plugin_position"
      # follow_path_plugin_name: "follow_path_plugin_trajectory"

  # Trajectory Generation Behavior
  TrajectoryGeneratorBehavior:
    ros__parameters:
      plugin_name: "dynamic_mav_trajectory_generator"

  # Hardware Interfaces
  usb_camera_interface:
    ros__parameters:
      device: "/dev/video0"
      framerate: 30.0 # Frame rate of the camera (fps)
      # Camera configuration
      camera_transform:
        parent_frame: "base_link" # Parent frame of the camera
        x: 0.1 # Translation in x (m)
        y: 0.0 # Translation in y (m)
        z: 0.03 # Translation in z (m)
        roll: -1.57079632679 # Rotation around x (rad)
        pitch: 0.0 # Rotation around y (rad)
        yaw: -1.57079632679 # Rotation around z (rad)

# Specific Parameters for each drone
# drone0:
#   # Motion Capture
#   state_estimator:
#     ros__parameters:
#       rigid_body_name: "1"

# For simulation, specific target_system_id for each drone
drone0:
  platform:
    ros__parameters:
      fmu_prefix: /drone0
      target_system_id: 0
drone1:
  platform:
    ros__parameters:
      fmu_prefix: /drone1
      target_system_id: 1
drone2:
  platform:
    ros__parameters:
      fmu_prefix: /drone2
      target_system_id: 2